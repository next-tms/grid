name: Push
on:
  push:
    branches:
      - main
  workflow_call:
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  push:
    name: Push
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: push
      cancel-in-progress: false
    env:
      DATA_IMAGE: ghcr.io/${{ github.repository }}-data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@78c62f2208e480ce3d5ae4dfd9b9e181acf48b63 # v1.344.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Find the data image
        id: data
        run: |
          version=$(bin/rails data:version)
          if digest=$(docker buildx imagetools inspect "$DATA_IMAGE:$version" --format '{{json .Manifest}}' | jq -er .digest); then
            echo "image=$DATA_IMAGE@$digest" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No grid-data image $version yet, so this image has no data files."
            echo "image=no-data" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            DATA_IMAGE=${{ steps.data.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:latest
