services:
  app: &app
    build: .
    env_file:
      - path: ./.env.example
      - path: ./.docker-compose.env
        required: false
    environment:
      DATABASE_URL: postgres://grid:grid@db:5434/grid
      RACK_ENV: production
      RAILS_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:4743:4743"
    volumes:
      - ./db:/usr/share/grid:ro
  migrate:
    <<: *app
    command: bin/rails db:prepare
    depends_on:
      db:
        condition: service_healthy
    ports: []
  db:
    environment:
      PGPORT: 5434
      POSTGRES_DB: grid
      POSTGRES_PASSWORD: grid
      POSTGRES_USER: grid
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U grid -d grid"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 120s
    image: postgres:18.6-alpine3.24
    volumes:
      - ./data/postgres:/var/lib/postgresql
